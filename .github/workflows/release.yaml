name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client_v2/package-lock.json

      - name: Build frontend
        run: |
          set -euo pipefail
          cd client_v2
          npm ci
          npm run build-prod

      - name: Build Linux binaries
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          case "${VERSION}" in
            *-mobile.*) ;;
            *) VERSION="${VERSION}-mobile.$(date -u +%Y%m%d)" ;;
          esac

          COMMITTIME="$(git log -1 --pretty=%ct)"
          mkdir -p dist

          for ARCH in amd64 arm64; do
            OUT="dist/AdGuardHome_linux_${ARCH}"
            mkdir -p "${OUT}/AdGuardHome"

            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" GOAMD64=v1 \
              go build -trimpath \
              -ldflags "-s -w \
                -X github.com/AdguardTeam/AdGuardHome/internal/version.version=${VERSION} \
                -X github.com/AdguardTeam/AdGuardHome/internal/version.channel=release \
                -X github.com/AdguardTeam/AdGuardHome/internal/version.committime=${COMMITTIME}" \
              -o "${OUT}/AdGuardHome/AdGuardHome" .

            tar -C "${OUT}" -czf "dist/AdGuardHome_linux_${ARCH}.tar.gz" AdGuardHome
          done

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AdGuardHome_linux_*.tar.gz
          prerelease: true
          generate_release_notes: true

      - name: Update version.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          case "${VERSION}" in
            *-mobile.*) ;;
            *) VERSION="${VERSION}-mobile.$(date -u +%Y%m%d)" ;;
          esac

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          jq --arg v "${VERSION}" \
             --arg b "${BASE}" \
             '.version = $v
              | .announcement = "AdGuard Home Mobile Core \($v) is now available!"
              | .announcement_url = $b
              | .download_linux_amd64 = "\($b)/AdGuardHome_linux_amd64.tar.gz"
              | .download_linux_arm64 = "\($b)/AdGuardHome_linux_arm64.tar.gz"' \
             version.json > version.json.tmp
          mv version.json.tmp version.json

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add version.json
          git commit -m "chore: update version.json for ${VERSION}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
