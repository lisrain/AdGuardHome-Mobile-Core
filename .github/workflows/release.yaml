name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        run: |
          set -euo pipefail
          cd client
          npm ci
          npm run build-prod

      - name: Build Linux binaries
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}-mobile.$(date -u +%Y%m%d)"
          COMMITTIME="$(git log -1 --pretty=%ct)"
          mkdir -p dist

          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" GOAMD64=v1 \
              go build -trimpath \
              -ldflags "-s -w \
                -X github.com/AdguardTeam/AdGuardHome/internal/version.version=${VERSION} \
                -X github.com/AdguardTeam/AdGuardHome/internal/version.channel=release \
                -X github.com/AdguardTeam/AdGuardHome/internal/version.committime=${COMMITTIME}" \
              -o "dist/AdGuardHome_linux_${ARCH}" .

            tar -C dist -czf "dist/AdGuardHome_linux_${ARCH}.tar.gz" "AdGuardHome_linux_${ARCH}"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

      - name: Update version.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}-mobile.$(date -u +%Y%m%d)"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          jq --arg v "${VERSION}" \
             --arg u "${BASE}/AdGuardHome_linux_arm64.tar.gz" \
             '.new_version = $v | .download_linux_arm64 = $u' \
             version.json > version.json.tmp
          mv version.json.tmp version.json

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add version.json
          git commit -m "chore: update version.json for ${VERSION}"
          git push origin "HEAD:${GITHUB_DEFAULT_BRANCH:-main}"
